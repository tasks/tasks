name: Run automated checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: ./.github/actions/setup-gradle

      - name: Lint checks
        run: bundle exec fastlane lint

      - name: Archive lint reports
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: lint-reports
          path: app/build/reports/*.html

  jvmTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      - name: Install Compose test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libx11-6

      - name: Run JVM tests
        run: ./gradlew -Pcoverage app:createGoogleplayDebugUnitTestCoverageReport app:createGenericDebugUnitTestCoverageReport jvmTest kmp:testDebugUnitTest composeApp:desktopTest

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-reports-jvm
          path: |
            app/build/reports/**
            data/build/reports/**
            kmp/build/reports/**
            composeApp/build/reports/**

  iosTest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Cache libical
        uses: actions/cache@v6
        with:
          path: |
            kmp/build/libical/libical.xcframework
            kmp/build/libical/src/zoneinfo
            kmp/build/libical/.stamp
          key: libical-${{ runner.os }}-${{ hashFiles('kmp/build-libical.sh') }}

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Boot a simulator
        run: xcrun simctl boot "$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone [0-9]+$"))] | last | .udid')"

      - name: Build for iOS and run simulator tests
        run: ./gradlew :composeApp:compileKotlinIosArm64 :data:iosSimulatorArm64Test :kmp:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-reports-ios
          path: |
            data/build/reports/**
            kmp/build/reports/**
            composeApp/build/reports/**

  instrumentedTest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [Googleplay, Generic]
        api-level: [29]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew app:connected${{ matrix.flavor }}DebugAndroidTest

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-reports-${{ matrix.flavor }}
          path: app/build/reports/**
