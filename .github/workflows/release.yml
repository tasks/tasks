name: GitHub Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  bundle:
    uses: ./.github/workflows/bundle.yml
    secrets: inherit

  notarize:
    runs-on: ubuntu-latest
    environment: release
    needs: [ bundle ]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-conveyor

      - name: Download desktop jars
        uses: actions/download-artifact@v8
        with:
          name: desktop-jar

      - name: Write Apple notarization key
        env:
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        if: ${{ env.APPLE_PRIVATE_KEY != '' }}
        run: echo "$APPLE_PRIVATE_KEY" > "$RUNNER_TEMP/apple_api_key.p8"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build notarized desktop releases
        working-directory: composeApp
        env:
          SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          CONVEYOR_AGREE_TO_LICENSE: 1
        run: >
          conveyor
          -vvv
          -Kapp.mac.notarization.issuer-id=${{ secrets.APPLE_ISSUER_ID }}
          -Kapp.mac.notarization.key-id=${{ secrets.APPLE_KEY_ID }}
          -Kapp.mac.notarization.private-key=${{ runner.temp }}/apple_api_key.p8
          -Kapp.windows.signing-key.azure-trusted-signing.endpoint=https://eus.codesigning.azure.net/
          -Kapp.windows.signing-key-alias=Tasks/tasks-org
          -Kapp.windows.timestamping-server=http://timestamp.acs.microsoft.com
          make site

      - name: Upload notarized desktop output
        uses: actions/upload-artifact@v7
        with:
          name: desktop-notarized
          path: composeApp/output/

  release:
    runs-on: ubuntu-latest
    needs: [ bundle, notarize ]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-fastlane
        with:
          json-key: ${{ secrets.FASTLANE }}

      - name: Download Play-signed APK
        run: bundle exec fastlane download_signed_apk

      - uses: actions/download-artifact@v8
        with:
          name: app-generic-release.apk
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: pebble.pbw
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: desktop-linux-appimage
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: desktop-notarized
          path: composeApp/output

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: .

      - name: Package mapping files
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF_NAME}
          package() {
            src=$1
            label=$2
            id=$(sed -n 's/^# pg_map_id: //p' "$src" | head -1)
            [ -n "$id" ] || { echo "::error::no pg_map_id in $src"; exit 1; }
            gzip -9 -c "$src" > "mapping-${label}-${TAG}-${id:0:12}.txt.gz"
          }
          package app/build/outputs/mapping/googleplayRelease/mapping.txt googleplay
          package wear/build/outputs/mapping/release/mapping.txt wear
          ls -l mapping-*.txt.gz

      - name: Rename artifacts
        run: |
          TAG=${GITHUB_REF_NAME}
          mv artifacts/app-generic-release.apk "tasks-fdroid-${TAG}.apk"
          mv tasks-googleplay-release.apk "tasks-googleplay-${TAG}.apk"
          mv artifacts/pebble.pbw "tasks-pebble-${TAG}.pbw"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-artifacts
          path: |
            tasks-fdroid-*.apk
            tasks-googleplay-*.apk
            tasks-pebble-*.pbw
            mapping-*.txt.gz
            composeApp/output/*.zip
            composeApp/output/*.tar.gz
            composeApp/output/*.msix
            composeApp/output/*.deb
            composeApp/output/*.delta
            artifacts/*.AppImage
            artifacts/*.AppImage.zsync

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --generate-notes
          tasks-fdroid-*.apk
          tasks-googleplay-*.apk
          tasks-pebble-*.pbw
          mapping-*.txt.gz
          composeApp/output/*.zip
          composeApp/output/*.tar.gz
          composeApp/output/*.msix
          composeApp/output/*.deb
          composeApp/output/*.exe
          composeApp/output/*.appinstaller
          $(ls composeApp/output/*.delta 2>/dev/null)
          composeApp/output/metadata.properties
          composeApp/output/appcast-*.rss
          composeApp/output/Packages
          composeApp/output/Packages.xz
          composeApp/output/Release
          composeApp/output/InRelease
          artifacts/*.AppImage
          artifacts/*.AppImage.zsync

      - name: Prepare download page
        uses: ./.github/actions/prepare-download-page

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy-download-page:
    runs-on: ubuntu-latest
    needs: [ release ]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
