name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+-beta[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-beta[0-9]+'

concurrency:
  group: release
  queue: max

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.version.outputs.track }}
      conveyor-flags: ${{ steps.version.outputs.conveyor-flags }}
      update-url: ${{ steps.version.outputs.update-url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check version
        id: version
        run: |
          set -euo pipefail
          TAG=$GITHUB_REF_NAME
          NAME=$(sed -n 's/^VERSION_NAME=//p' version.properties)
          if [ "${TAG%-beta*}" != "$NAME" ]; then
            echo "::error::tag $TAG does not match VERSION_NAME=$NAME"
            exit 1
          fi

          if [[ $TAG == *-beta* ]]; then
            {
              echo "track=beta"
              echo "update-url=https://update.tasks.org/beta"
              echo "conveyor-flags=-Kapp.revision=$((10#${TAG##*-beta}))"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "track=production"
              echo "update-url=https://update.tasks.org"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-fastlane
        with:
          json-key: ${{ secrets.FASTLANE }}

      - name: Check version code
        run: bundle exec fastlane check_version_code track:${{ steps.version.outputs.track }}

  check:
    needs: [ version ]
    uses: ./.github/workflows/check.yml

  bundle:
    needs: [ check ]
    uses: ./.github/workflows/android.yml
    secrets: inherit

  desktop-jar:
    runs-on: ubuntu-latest
    needs: [ version ]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/desktop-jar
        with:
          posthog-key: ${{ secrets.POSTHOG_KEY }}

  site:
    runs-on: ubuntu-latest
    needs: [ version, check, desktop-jar ]
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      UPDATE_URL: ${{ needs.version.outputs.update-url }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-conveyor

      - name: Download desktop jars
        uses: actions/download-artifact@v8
        with:
          name: desktop-jar

      - name: Write Apple notarization key
        env:
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: echo "$APPLE_PRIVATE_KEY" > "$RUNNER_TEMP/apple_api_key.p8"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build notarized desktop releases
        working-directory: composeApp
        env:
          SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          CONVEYOR_AGREE_TO_LICENSE: 1
        run: >
          conveyor
          -vvv
          --logs-dir=$RUNNER_TEMP/conveyor-logs
          ${{ needs.version.outputs.conveyor-flags }}
          -Kapp.site.base-url=$UPDATE_URL
          -Kapp.mac.notarization.issuer-id=${{ secrets.APPLE_ISSUER_ID }}
          -Kapp.mac.notarization.key-id=${{ secrets.APPLE_KEY_ID }}
          -Kapp.mac.notarization.private-key=${{ runner.temp }}/apple_api_key.p8
          -Kapp.windows.signing-key.azure-trusted-signing.endpoint=https://eus.codesigning.azure.net
          -Kapp.windows.signing-key-alias=Tasks/tasks-org
          make site

      - uses: ./.github/actions/save-conveyor-linker-jdk

      - name: Upload Conveyor logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conveyor-logs
          path: ${{ runner.temp }}/conveyor-logs/

      - name: Upload desktop site
        uses: actions/upload-artifact@v7
        with:
          name: desktop-site
          compression-level: 0
          path: |
            composeApp/output/
            !composeApp/output/*-linux-*.tar.gz
            !composeApp/output/download.html

      - name: Upload download page
        uses: actions/upload-artifact@v7
        with:
          name: download-page
          path: composeApp/output/download.html

      - name: Upload Linux tarballs
        uses: actions/upload-artifact@v7
        with:
          name: desktop-site-linux
          compression-level: 0
          path: composeApp/output/*-linux-*.tar.gz

  appimage:
    runs-on: ubuntu-latest
    needs: [ version, site ]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            scripts

      - uses: ./.github/actions/appimage
        with:
          tarballs: desktop-site-linux
          name: desktop-site-appimage
          update-url: ${{ needs.version.outputs.update-url }}

      - uses: actions/download-artifact@v8
        with:
          name: download-page

      - name: Add AppImage buttons
        run: scripts/add-appimage-buttons.py download.html "${{ needs.version.outputs.update-url }}"

      - name: Upload download page
        uses: actions/upload-artifact@v7
        with:
          name: desktop-site-download-page
          path: download.html

  android:
    runs-on: ubuntu-latest
    needs: [ version, bundle, appimage ]
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-fastlane
        with:
          json-key: ${{ secrets.FASTLANE }}

      - uses: actions/download-artifact@v8
        with:
          pattern: '{release,app-generic-release.apk,pebble.pbw}'
          merge-multiple: true

      - name: Collect release files
        run: |
          set -euo pipefail
          mapping() {
            local label=$1 file=$2 id
            id=$(sed -n 's/^# pg_map_id: //p' "$file" | head -1)
            if [ -z "$id" ]; then
              echo "::error::no pg_map_id in $file"
              exit 1
            fi
            gzip -9 -c "$file" > "android/mapping-$label-$TAG-${id:0:12}.txt.gz"
          }
          mkdir android
          mv app-generic-release.apk "android/tasks-fdroid-$TAG.apk"
          mv pebble.pbw "android/tasks-pebble-$TAG.pbw"
          mapping googleplay app/build/outputs/mapping/googleplayRelease/mapping.txt
          mapping wear wear/build/outputs/mapping/release/mapping.txt

      - name: Upload to ${{ needs.version.outputs.track }} track
        run: bundle exec fastlane deploy track:${{ needs.version.outputs.track }}

      - name: Download Play-signed APK
        run: |
          for attempt in 1 2 3 4 5; do
            bundle exec fastlane download_signed_apk && break
            [ "$attempt" = 5 ] && exit 1
            sleep 60
          done
          mv tasks-googleplay-release.apk "android/tasks-googleplay-$TAG.apk"

      - name: Upload Android release files
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: android/

  release:
    runs-on: ubuntu-latest
    needs: [ version, android ]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-release
          path: android
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-site*
          merge-multiple: true
          path: desktop

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TRACK: ${{ needs.version.outputs.track }}
        run: |
          set -euo pipefail
          ls -l android desktop
          if ! gh release view "$TAG" > /dev/null; then
            args=(--draft --generate-notes)
            if [ "$TRACK" = beta ]; then
              args+=(--prerelease)
            else
              args+=(--notes-start-tag "$(gh release view --json tagName -q .tagName)")
            fi
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" --clobber android/* desktop/*
          gh release edit "$TAG" --draft=false

  download-page:
    needs: [ release ]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/republish-download-page.yml
