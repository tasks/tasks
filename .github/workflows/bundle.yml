name: Assemble bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  android:
    needs: [ check ]
    uses: ./.github/workflows/android.yml
    secrets: inherit

  desktop-jar:
    runs-on: ubuntu-latest
    needs: [ check ]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/desktop-jar
        with:
          posthog-key: ${{ secrets.POSTHOG_KEY }}

  desktop:
    runs-on: ubuntu-latest
    needs: [ desktop-jar ]
    strategy:
      matrix:
        include:
          - platform: linux-deb-amd64
            target: debian-package
            flags: "-Kapp.machines=linux.amd64.glibc"
          - platform: linux-deb-aarch64
            target: debian-package
            flags: "-Kapp.machines=linux.aarch64.glibc"
          - platform: linux-tar-gz-amd64
            target: linux-tarball
            flags: "-Kapp.machines=linux.amd64.glibc"
          - platform: linux-tar-gz-aarch64
            target: linux-tarball
            flags: "-Kapp.machines=linux.aarch64.glibc"
          - platform: macos-amd64
            target: unnotarized-mac-zip
            flags: "-Kapp.machines=mac.amd64"
          - platform: macos-aarch64
            target: unnotarized-mac-zip
            flags: "-Kapp.machines=mac.aarch64"
          - platform: windows-msix-amd64
            target: windows-msix
            flags: "-Kapp.machines=windows.amd64"
          - platform: windows-msix-aarch64
            target: windows-msix
            flags: "-Kapp.machines=windows.aarch64"
          - platform: windows-zip-amd64
            target: windows-zip
            flags: "-Kapp.machines=windows.amd64"
          - platform: windows-zip-aarch64
            target: windows-zip
            flags: "-Kapp.machines=windows.aarch64"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-conveyor
        with:
          cache-name: ${{ matrix.platform }}

      - name: Download desktop jars
        uses: actions/download-artifact@v8
        with:
          name: desktop-jar

      - name: Build ${{ matrix.platform }} desktop
        working-directory: composeApp
        env:
          CONVEYOR_AGREE_TO_LICENSE: 1
          SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
        run: conveyor --logs-dir="$RUNNER_TEMP/conveyor-logs" ${{ matrix.flags }} make ${{ matrix.target }}

      - name: Upload Conveyor logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conveyor-logs-${{ matrix.platform }}
          path: ${{ runner.temp }}/conveyor-logs/

      - name: Upload desktop-${{ matrix.platform }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          compression-level: 0
          path: composeApp/output/

  appimage:
    runs-on: ubuntu-latest
    needs: [ desktop ]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
            scripts

      - uses: ./.github/actions/appimage
        with:
          tarballs: desktop-linux-tar-gz-*
          name: desktop-linux-appimage
          update-url: https://update.tasks.org
