
name: Build Tasks Android Google Play

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-gradle

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "platform-tools"

      - name: Build Google Play Debug APK
        run: ./gradlew :app:assembleGoogleplayDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Tasks-Android-GooglePlay
          path: app/build/outputs/apk/googleplay/debug/*.apk
          if-no-files-found: error
          retention-days: 30
