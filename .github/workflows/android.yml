name: Build Android

on:
  workflow_call:

permissions:
  contents: read

env:
  PEBBLE_SDK_VERSION: '4.9.127'
  PEBBLE_TOOL_VERSION: '5.0.39'
  PEBBLE_PYTHON_VERSION: '3.13.12'

jobs:
  pebble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PEBBLE_PYTHON_VERSION }}

      - name: Cache Pebble SDK
        id: cache-pebble
        uses: actions/cache@v6
        with:
          path: ~/.pebble-sdk
          key: pebble-sdk-${{ env.PEBBLE_SDK_VERSION }}-tool${{ env.PEBBLE_TOOL_VERSION }}-py${{ env.PEBBLE_PYTHON_VERSION }}-${{ runner.os }}

      - name: Install pebble-tool
        run: pip install "pebble-tool==$PEBBLE_TOOL_VERSION"

      - name: Install Pebble SDK
        if: ${{ steps.cache-pebble.outputs.cache-hit != 'true' }}
        run: pebble sdk install "$PEBBLE_SDK_VERSION"

      - name: Install emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libsdl1.2debian libfdt1 librsvg2-bin

      - name: Generate screenshots
        run: |
          export DISPLAY=:99
          Xvfb :99 &
          sleep 2
          cd pebble && ./screenshots.sh

      - name: Build Pebble app
        run: cd pebble && pebble clean && pebble build

      - name: Generate store icons
        run: |
          mkdir -p pebble/screenshots
          for size in 48 80 144; do
            rsvg-convert -w $size -h $size graphics/icon.svg -o pebble/screenshots/icon_$size.png
          done
          rsvg-convert -w 720 -h 320 graphics/promo.svg -o pebble/screenshots/banner_720x320.png

      - name: Upload Pebble app
        uses: actions/upload-artifact@v7
        with:
          name: pebble.pbw
          path: pebble/build/pebble.pbw

      - name: Upload store assets
        uses: actions/upload-artifact@v7
        with:
          name: pebble-store-assets
          path: pebble/screenshots/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: ./.github/actions/setup-gradle

      - name: Decode keystore
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: echo "$KEY_STORE" | base64 -di > "$RUNNER_TEMP/keystore.jks"

      - name: Bundle
        env:
          KEY_PATH: ${{ runner.temp }}/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          MAPBOX_KEY: ${{ secrets.MAPBOX_KEY }}
          GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: bundle exec fastlane bundle

      - name: Upload app APK
        uses: actions/upload-artifact@v7
        with:
          name: app-googleplay-release.apk
          path: app/build/outputs/bundle/googleplayRelease/app-googleplay-release.apk
      - name: Upload wear APK
        uses: actions/upload-artifact@v7
        with:
          name: wear-release.apk
          path: wear/build/outputs/bundle/release/wear-release.apk
      - name: Upload release bundles
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            app/build/outputs/bundle/googleplayRelease/app-googleplay-release.aab
            app/build/outputs/mapping/googleplayRelease/mapping.txt
            wear/build/outputs/bundle/release/wear-release.aab
            wear/build/outputs/mapping/release/mapping.txt

  android-other:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      - name: Decode generic keystore
        env:
          KEY_STORE: ${{ secrets.GENERIC_KEY_STORE }}
        run: echo "$KEY_STORE" | base64 -d > "$RUNNER_TEMP/generic.jks"

      - name: Build generic and composeApp APKs
        env:
          ORG_GRADLE_PROJECT_tasksStoreFile: ${{ runner.temp }}/generic.jks
          ORG_GRADLE_PROJECT_tasksKeyAlias: ${{ secrets.GENERIC_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_tasksStorePassword: ${{ secrets.GENERIC_KEY_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_tasksKeyPassword: ${{ secrets.GENERIC_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_tasks_mapbox_key: ${{ secrets.MAPBOX_KEY }}
        run: ./gradlew :app:assembleGenericRelease :composeApp:assembleGoogleplayRelease

      - name: Upload generic APK
        uses: actions/upload-artifact@v7
        with:
          name: app-generic-release.apk
          path: app/build/outputs/apk/generic/release/app-generic-release.apk

      - name: Upload composeApp APK
        uses: actions/upload-artifact@v7
        with:
          name: composeApp-googleplay-release.apk
          path: composeApp/build/outputs/apk/googleplay/release/composeApp-googleplay-release.apk
