name: Install Conveyor
description: Set up JDK, Gradle and Conveyor

inputs:
  version:
    description: Conveyor version
    default: "22.0"
  sha256:
    description: Conveyor SHA-256
    default: "768ea002e99149deb502a9177c11f2f00dcbffa976e505f7f424a5492287ee3c"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-gradle

    - name: Cache Conveyor distribution
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/conveyor.tar.gz
        key: conveyor-dist-${{ inputs.version }}-${{ inputs.sha256 }}

    - name: Download Conveyor
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        if echo "$SHA256  $RUNNER_TEMP/conveyor.tar.gz" | sha256sum -c --status 2>/dev/null; then
          echo "Restored from cache, checksum verified."
          exit 0
        fi
        rm -f "$RUNNER_TEMP/conveyor.tar.gz"
        scripts/fetch "$RUNNER_TEMP/conveyor.tar.gz" "https://downloads.hydraulic.dev/conveyor/conveyor-$VERSION-linux-amd64.tar.gz" "$SHA256"
        ls -l "$RUNNER_TEMP/conveyor.tar.gz"

    - name: Extract Conveyor
      shell: bash
      run: sudo tar xf "$RUNNER_TEMP/conveyor.tar.gz" -C /usr/local --strip-components=1

    - name: Linker JDK cache key
      id: linker-jdk
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        jdk=$(sed -n 's#.*/stdlib/jdk/\([0-9]*\)/.*#\1#p' composeApp/conveyor.conf)
        echo "key=conveyor-linker-jdk-$VERSION-jdk$jdk-$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_OUTPUT"

    - name: Restore Conveyor linker JDK
      id: restore-linker-jdk
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/conveyor-linker-jdk
        key: ${{ steps.linker-jdk.outputs.key }}

    - name: Install Conveyor linker JDK
      shell: bash
      env:
        KEY: ${{ steps.linker-jdk.outputs.key }}
        HIT: ${{ steps.restore-linker-jdk.outputs.cache-hit }}
      run: |
        set -euo pipefail
        echo "CONVEYOR_LINKER_JDK_KEY=$KEY" >> "$GITHUB_ENV"
        echo "CONVEYOR_LINKER_JDK_HIT=$HIT" >> "$GITHUB_ENV"
        if [ -d "$RUNNER_TEMP/conveyor-linker-jdk" ]; then
          entries="$HOME/.cache/hydraulic/conveyor/cache/entries"
          mkdir -p "$entries"
          cp -R "$RUNNER_TEMP/conveyor-linker-jdk/." "$entries/"
        fi
